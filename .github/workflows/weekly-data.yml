name: weekly-data

on:
  schedule:
    # 11:00 UTC = 6am ET during EDT (through early Nov), 7am ET during EST
    # (rest of the season). GitHub Actions cron has no timezone support, so
    # this drifts by an hour after the fall DST change rather than staying
    # pinned to 6am local.
    - cron: '0 11 * * 1'
  workflow_dispatch:

jobs:
  fetch-weekly-data:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Fetch weekly data
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: pnpm fetch-weekly-data 2026

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/2026/rankings.json public/data/2026/win-probabilities.json public/data/2026/betting-lines.json
          git diff --staged --quiet && exit 0
          git commit -m "chore: weekly rankings and win probability data"
          git push
